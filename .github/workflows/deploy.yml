# =============================================================================
# TheLinuxBook — GitHub Actions: Build & Deploy to GitHub Pages
# Triggers on every push to `main` branch.
# =============================================================================

name: Deploy Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write     # Required for peaceiris/actions-gh-pages
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Deploy MkDocs Site
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repository (full history for git-revision-date plugin) ──
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Full git history needed for revision dates

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Build site (strict mode = fail on warnings) ────────────────────
      - name: Build MkDocs site
        run: mkdocs build --strict --verbose
        env:
          GOOGLE_ANALYTICS_KEY: ${{ secrets.GOOGLE_ANALYTICS_KEY }}

      # ── 5. Deploy to GitHub Pages (gh-pages branch) ───────────────────────
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "Deploy: ${{ github.event.head_commit.message }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          cname: ""              # Set your custom domain here if you have one
